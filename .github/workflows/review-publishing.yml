name: Review and publishing integration

on:
  workflow_dispatch:
    inputs:
      integration_ref:
        description: 'Combined D/E ref; resolved SHA is recorded in artifacts'
        required: true
        default: '3187098fac9d91c14d1fdfe40bb765797cde8cfd'
        type: string
  push:
    branches: [thaninton_673380043-6_02]
  pull_request:

permissions:
  contents: read

jobs:
  review-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: primeskill_test_review_ci
          POSTGRES_USER: primeskill_test
          POSTGRES_PASSWORD: ci-only-disposable-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primeskill_test -d primeskill_test_review_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRIMESKILL_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/primeskill_test_review_ci
      PRIMESKILL_TEST_DB_USERNAME: primeskill_test
      PRIMESKILL_TEST_DB_PASSWORD: ci-only-disposable-database
      MAVEN_ARGS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_ref || '3187098fac9d91c14d1fdfe40bb765797cde8cfd' }}
          path: integration
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: integration/code/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          git -C harness rev-parse HEAD > ci-evidence/harness-sha.txt
          git -C integration rev-parse HEAD > ci-evidence/integration-sha.txt
          java -version 2> ci-evidence/java-version.txt
      - name: Test CI report coverage gate
        run: python harness/scripts/test-review-ci-reports.py -v
      - name: Verify unmodified combined snapshot
        working-directory: integration
        run: mvn -B -f code/pom.xml -Ppostgres-it verify
      - name: Preserve baseline reports before adding fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/baseline
          cp -R integration/code/target/surefire-reports ci-evidence/baseline/
          cp -R integration/code/target/failsafe-reports ci-evidence/baseline/
      - name: Add external test fixtures without changing production or config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          sources = [
              Path('harness/test/role-d-postgres/RoleDPostgresIT.java'),
              Path('harness/test/review-publishing-race/ReviewPublishingRacePostgresIT.java'),
          ]
          manifest = {}
          for source in sources:
              data = source.read_bytes()
              destination = Path('integration/code/src/test/java/com/example/toolhub') / source.name
              if destination.exists() and destination.read_bytes() != data:
                  raise SystemExit('Existing fixture differs; review before overwriting: ' + source.name)
              destination.write_bytes(data)
              manifest[source.name] = hashlib.sha256(data).hexdigest()
          Path('ci-evidence/fixture-hashes.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          git -C integration diff --exit-code -- code/src/main code/pom.xml code/src/test/resources
      - name: Verify expanded review and publishing suite
        working-directory: integration
        run: mvn -B -f code/pom.xml -Ppostgres-it verify
      - name: Require race and rollback XML results
        run: python harness/scripts/check-review-ci-reports.py integration/code/target --output ci-evidence/overlay-summary.json
      - name: Upload baseline, overlay and revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-publishing-evidence
          path: |
            ci-evidence/
            integration/code/target/surefire-reports/
            integration/code/target/failsafe-reports/
          if-no-files-found: warn

name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main, thaninton_673380043-6_02]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unique disposable Compose project: cleanup cannot target a developer's stack.
      COMPOSE_PROJECT_NAME: primeskill-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci-only-disposable-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: code/pom.xml
      - name: Verify
        run: mvn -B -f code/pom.xml verify
      - name: Build container image
        run: docker compose build app
      - name: Check Vercel deployment configuration
        run: python3 scripts/test_vercel_configuration.py -v
      - name: Build Vercel container image
        run: docker build -f Dockerfile.vercel -t primeskill-vercel:${{ github.sha }} .
      - name: Verify container startup and database restart persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --no-build
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8080/actuator/health | jq -e '.status == "UP"'
          docker compose exec -T db psql -U toolhub -d toolhub -v ON_ERROR_STOP=1 \
            -c "INSERT INTO categories(name, slug) VALUES ('CI restart probe', 'ci-restart-probe');"
          docker compose stop app db
          docker compose up -d --no-build
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8080/actuator/health | jq -e '.status == "UP"'
          count=$(docker compose exec -T db psql -U toolhub -d toolhub -At \
            -c "SELECT count(*) FROM categories WHERE slug = 'ci-restart-probe';")
          test "$count" = "1"
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove this run's disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: code/target/surefire-reports/
          if-no-files-found: ignore

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: primeskill_test_ci
          POSTGRES_USER: primeskill_test
          POSTGRES_PASSWORD: ci-only-disposable-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primeskill_test -d primeskill_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRIMESKILL_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/primeskill_test_ci
      PRIMESKILL_TEST_DB_USERNAME: primeskill_test
      PRIMESKILL_TEST_DB_PASSWORD: ci-only-disposable-database
      MAVEN_ARGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: code/pom.xml
      - name: Verify unit tests and PostgreSQL publishing regressions
        run: mvn -B -f code/pom.xml -Ppostgres-it verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify B metadata and E B1 report gate
        run: |
          python scripts/test-review-ci-reports.py -v
          python scripts/test-role-e-b1-reports.py -v
          python scripts/check-role-e-b1-reports.py code/target --output code/target/b1-evidence/summary.json
          python scripts/test-role-c-reports.py -v
          python scripts/check-role-c-reports.py code/target --output code/target/b1-evidence/role-c-summary.json
          git rev-parse HEAD > code/target/b1-evidence/source-sha.txt
          java -version 2> code/target/b1-evidence/java-version.txt
      - name: Upload PostgreSQL integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports
          path: |
            code/target/surefire-reports/
            code/target/failsafe-reports/
            code/target/b1-evidence/
          if-no-files-found: ignore

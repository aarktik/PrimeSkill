# Opt-in only. The context initializer validates this URL before SQL initialization.
spring.datasource.url=${PRIMESKILL_TEST_DB_URL}
spring.datasource.username=${PRIMESKILL_TEST_DB_USERNAME}
spring.datasource.password=${PRIMESKILL_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Schema changes are an explicit operator action, never a cold-start side effect.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
server.address=0.0.0.0
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Bind the HTTP listener before initializing request-only components. Schema
# validation remains enabled and is exercised by deployment acceptance checks.
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy
# Bound the connections consumed by each independently scaled container.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

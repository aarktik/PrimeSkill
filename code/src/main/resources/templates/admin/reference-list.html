<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><header th:replace="~{fragments/layout :: navbar}"></header><div class="ps-workspace"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main id="main" tabindex="-1" class="ps-workspace-main"><header class="ps-e-header"><div><span class="ps-eyebrow">Administration</span><h1 th:text="${pageTitle}"></h1><p th:text="${kind == 'categories' ? 'Organize the directory so useful tools are easy to find.' : 'Manage the labels creators can use to describe their tools.'}"></p></div><a class="ps-btn ps-btn--primary" th:href="@{'/admin/' + ${kind} + '/new'}" th:text="${kind == 'categories' ? 'New category' : 'New tag'}"></a></header><div th:replace="~{fragments/layout :: alerts}"></div><div class="ps-empty" th:if="${#lists.isEmpty(items)}"><h2>Start with a useful label.</h2><p>Create the first entry to help creators organize their tools.</p></div><div class="ps-table-card" th:unless="${#lists.isEmpty(items)}"><table class="ps-table"><thead><tr><th scope="col">Name</th><th scope="col">Slug</th><th scope="col">Actions</th></tr></thead><tbody><tr th:each="item : ${items}"><td><strong th:text="${item.name()}"></strong></td><td><code th:text="${item.slug()}"></code></td><td><div class="ps-row-actions"><a class="ps-btn ps-btn--secondary" th:href="@{'/admin/' + ${kind} + '/' + ${item.id()} + '/edit'}">Edit</a><form method="post" th:action="@{'/admin/' + ${kind} + '/' + ${item.id()} + '/delete'}" data-confirm="Delete this entry? Entries still used by tools cannot be deleted." data-confirm-title="Delete directory entry?" data-confirm-action="Delete" data-confirm-danger="true"><button class="ps-e-link-danger" type="submit">Delete</button></form></div></td></tr></tbody></table></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>

<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><header th:replace="~{fragments/layout :: navbar}"></header><div class="ps-workspace"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main id="main" tabindex="-1" class="ps-workspace-main"><nav class="ps-crumb" aria-label="Breadcrumb"><a th:href="@{'/admin/' + ${kind}}" th:text="${kind == 'categories' ? 'Categories' : 'Tags'}"></a></nav><header class="ps-e-header"><div><h1 th:text="${pageTitle}"></h1><p>Use a clear name and a consistent address for this entry.</p></div></header><form class="ps-panel ps-e-form ps-reference-form" th:action="${formAction}" th:object="${referenceRequest}" method="post" novalidate><div th:replace="~{fragments/layout :: errorSummary('referenceRequest','')}"></div><div class="ps-form-field"><label for="name">Name</label><input id="name" type="text" th:field="*{name}" maxlength="100" required th:attr="aria-invalid=${#fields.hasErrors('name')}" th:aria-describedby="${#fields.hasErrors('name') ? 'name-error' : null}"><p id="name-error" class="ps-field-error" th:if="${#fields.hasErrors('name')}" th:text="${@uiText.field(#vars['org.springframework.validation.BindingResult.referenceRequest'].getFieldError('name'))}"></p></div><div class="ps-form-field"><label for="slug">Slug</label><input id="slug" type="text" th:field="*{slug}" maxlength="120" required th:attr="aria-invalid=${#fields.hasErrors('slug')}" th:aria-describedby="${#fields.hasErrors('slug') ? 'slug-error' : null}"><p class="ps-field-help">Lowercase letters, numbers, and hyphens. For example: developer-tools.</p><p id="slug-error" class="ps-field-error" th:if="${#fields.hasErrors('slug')}" th:text="${@uiText.field(#vars['org.springframework.validation.BindingResult.referenceRequest'].getFieldError('slug'))}"></p></div><div th:if="${kind == 'categories'}"><div class="ps-form-field"><label for="description">Description</label><textarea id="description" th:field="*{description}" maxlength="500" th:attr="aria-invalid=${#fields.hasErrors('description')}" th:aria-describedby="${#fields.hasErrors('description') ? 'description-error' : null}"></textarea><p id="description-error" class="ps-field-error" th:if="${#fields.hasErrors('description')}" th:text="${@uiText.field(#vars['org.springframework.validation.BindingResult.referenceRequest'].getFieldError('description'))}"></p></div></div><div class="ps-e-actions"><a class="ps-btn ps-btn--secondary" th:href="@{'/admin/' + ${kind}}">Cancel</a><button class="ps-btn ps-btn--primary" type="submit">Save entry</button></div></form></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>

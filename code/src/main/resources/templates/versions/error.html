<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" tabindex="-1" class="ps-page ps-error-page">
    <section class="ps-e-card" role="alert">
        <h1>Something went wrong</h1>
        <p th:text="${message}">Please try again.</p>
        <div th:replace="~{fragments/layout :: errorActions}"></div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

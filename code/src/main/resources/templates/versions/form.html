<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<div class="ps-workspace"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main id="main" tabindex="-1" class="ps-workspace-main ps-e-page ps-e-page--form">
    <nav class="ps-crumb" aria-label="Breadcrumb"><a th:href="@{/dashboard/tools/{id}/versions(id=${tool.id})}">Versions of <span th:text="${tool.name}">Tool</span></a></nav>
    <header class="ps-e-header"><h1 th:text="${pageTitle}">New version</h1></header>
    <form class="ps-e-card ps-e-form" th:action="${formAction}" th:object="${versionRequest}" method="post" novalidate><div th:replace="~{fragments/layout :: errorSummary('versionRequest','')}"></div>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div>
            <label for="version">Version number</label>
            <input id="version" th:field="*{version}" maxlength="100" required aria-describedby="version-error"
                   th:attr="aria-invalid=${#fields.hasErrors('version')}">
            <p id="version-error" th:if="${#fields.hasErrors('version')}" th:text="${@uiText.field(#vars['org.springframework.validation.BindingResult.versionRequest'].getFieldError('version'))}" role="alert"></p>
        </div>
        <div>
            <label for="releaseNotes">Release notes</label>
            <textarea id="releaseNotes" th:field="*{releaseNotes}" maxlength="2000" aria-describedby="notes-error"
                      th:attr="aria-invalid=${#fields.hasErrors('releaseNotes')}"></textarea>
            <p id="notes-error" th:if="${#fields.hasErrors('releaseNotes')}" th:text="${@uiText.field(#vars['org.springframework.validation.BindingResult.versionRequest'].getFieldError('releaseNotes'))}" role="alert"></p>
        </div>
        <div class="ps-e-actions">
            <a class="ps-e-button ps-e-button--secondary" th:href="@{/dashboard/tools/{id}/versions(id=${tool.id})}">Cancel</a>
            <button class="ps-e-button ps-e-button--primary" type="submit">Save version</button>
        </div>
    </form>
</main></div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

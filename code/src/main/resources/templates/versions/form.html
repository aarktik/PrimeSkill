<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · Primeskill'">จัดการเวอร์ชัน · Primeskill</title>
    <link rel="stylesheet" th:href="@{/css/role-e.css}">
</head>
<body>
<main class="ps-e-page ps-e-page--form">
    <nav aria-label="เส้นทางนำทาง"><a th:href="@{/dashboard/tools/{id}/versions(id=${tool.id})}">เวอร์ชันของ <span th:text="${tool.name}">Tool</span></a></nav>
    <header class="ps-e-header"><h1 th:text="${pageTitle}">เพิ่มเวอร์ชัน</h1></header>
    <form class="ps-e-card ps-e-form" th:action="${formAction}" th:object="${versionRequest}" method="post" novalidate>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div>
            <label for="version">เลขเวอร์ชัน</label>
            <input id="version" th:field="*{version}" maxlength="100" required aria-describedby="version-error"
                   th:attr="aria-invalid=${#fields.hasErrors('version')}">
            <p id="version-error" th:if="${#fields.hasErrors('version')}" th:errors="*{version}" role="alert"></p>
        </div>
        <div>
            <label for="releaseNotes">บันทึกการเปลี่ยนแปลง</label>
            <textarea id="releaseNotes" th:field="*{releaseNotes}" maxlength="2000" aria-describedby="notes-error"
                      th:attr="aria-invalid=${#fields.hasErrors('releaseNotes')}"></textarea>
            <p id="notes-error" th:if="${#fields.hasErrors('releaseNotes')}" th:errors="*{releaseNotes}" role="alert"></p>
        </div>
        <div class="ps-e-actions">
            <a class="ps-e-button ps-e-button--secondary" th:href="@{/dashboard/tools/{id}/versions(id=${tool.id})}">ยกเลิก</a>
            <button class="ps-e-button ps-e-button--primary" type="submit">บันทึกเวอร์ชัน</button>
        </div>
    </form>
</main>
</body>
</html>

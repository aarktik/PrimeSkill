<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · Primeskill'">เวอร์ชัน · Primeskill</title>
    <link rel="stylesheet" th:href="@{/css/role-e.css}">
</head>
<body>
<main class="ps-e-page">
    <nav aria-label="เส้นทางนำทาง"><a th:href="@{/dashboard/tools}">เครื่องมือของฉัน</a> / <span th:text="${tool.name}">Tool</span></nav>
    <header class="ps-e-header">
        <div>
            <h1 th:text="${pageTitle}">เวอร์ชันของเครื่องมือ</h1>
            <p>จัดการเวอร์ชันและสถานะการเผยแพร่</p>
        </div>
        <a th:if="${tool.status.name() == 'DRAFT'}" class="ps-e-button ps-e-button--primary"
           th:href="@{/dashboard/tools/{id}/versions/new(id=${tool.id})}">เพิ่มเวอร์ชัน</a>
    </header>
    <p th:if="${successMessage}" class="ps-e-alert ps-e-alert--success" role="status" th:text="${successMessage}"></p>

    <section class="ps-e-card" aria-labelledby="publishing-title">
        <h2 id="publishing-title">การเผยแพร่</h2>
        <p>สถานะ:
            <span th:if="${tool.status.name() == 'DRAFT'}" class="ps-e-badge ps-e-badge--neutral">แบบร่าง</span>
            <span th:if="${tool.status.name() == 'PENDING'}" class="ps-e-badge ps-e-badge--warning">รออนุมัติ</span>
            <span th:if="${tool.status.name() == 'PUBLISHED'}" class="ps-e-badge ps-e-badge--success">เผยแพร่แล้ว</span>
            <span th:if="${tool.status.name() == 'DEPRECATED'}" class="ps-e-badge ps-e-badge--neutral">เลิกเผยแพร่</span>
        </p>
        <form th:if="${tool.status.name() == 'DRAFT'}" th:action="@{/dashboard/tools/{id}/submit(id=${tool.id})}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ps-e-button ps-e-button--primary" type="submit">ส่งให้ตรวจ</button>
        </form>
        <p th:if="${tool.status.name() == 'PENDING'}">รอผู้ดูแลระบบพิจารณา</p>
        <form th:if="${tool.status.name() == 'PUBLISHED'}" th:action="@{/dashboard/tools/{id}/deprecate(id=${tool.id})}" method="post"
              onsubmit="return confirm('เลิกเผยแพร่เครื่องมือนี้หรือไม่?')">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ps-e-button ps-e-button--danger" type="submit">เลิกเผยแพร่</button>
        </form>
        <form th:if="${tool.status.name() == 'DEPRECATED'}" th:action="@{/dashboard/tools/{id}/restore(id=${tool.id})}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ps-e-button ps-e-button--primary" type="submit">กู้คืนเป็นแบบร่าง</button>
        </form>
    </section>

    <section class="ps-e-card" aria-labelledby="versions-title">
        <h2 id="versions-title">รายการเวอร์ชัน</h2>
        <p th:if="${#lists.isEmpty(versions)}">ยังไม่มีเวอร์ชันสำหรับเครื่องมือนี้</p>
        <div class="ps-e-table-wrap" th:unless="${#lists.isEmpty(versions)}">
            <table>
                <thead><tr><th scope="col">เวอร์ชัน</th><th scope="col">บันทึกการเปลี่ยนแปลง</th><th scope="col">การจัดการ</th></tr></thead>
                <tbody><tr th:each="version : ${versions}">
                    <td th:text="${version.version}">1.0.0</td>
                    <td th:text="${version.releaseNotes ?: '—'}">รายละเอียด</td>
                    <td>
                        <div class="ps-e-actions" th:if="${tool.status.name() == 'DRAFT'}">
                            <a th:href="@{/dashboard/tools/{toolId}/versions/{versionId}/edit(toolId=${tool.id},versionId=${version.id})}">แก้ไข</a>
                            <form th:action="@{/dashboard/tools/{toolId}/versions/{versionId}/delete(toolId=${tool.id},versionId=${version.id})}"
                                  method="post" onsubmit="return confirm('ลบเวอร์ชันนี้หรือไม่?')">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="ps-e-link-danger" type="submit">ลบ</button>
                            </form>
                        </div>
                        <span th:unless="${tool.status.name() == 'DRAFT'}">—</span>
                    </td>
                </tr></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>

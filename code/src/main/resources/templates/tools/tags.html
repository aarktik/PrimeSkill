<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><header th:replace="~{fragments/layout :: navbar}"></header><div class="ps-workspace"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main id="main" tabindex="-1" class="ps-workspace-main"><nav class="ps-crumb" aria-label="Breadcrumb"><a th:href="@{/tools/{slug}(slug=${tool.slug})}" th:text="${tool.name}"></a></nav><header class="ps-e-header"><div><h1>Manage tags</h1><p th:text="${tool.name}"></p></div><span th:replace="~{fragments/layout :: statusBadge(${tool.status})}"></span></header><div th:replace="~{fragments/layout :: alerts}"></div><section class="ps-panel"><h2>Assigned tags</h2><p class="ps-muted" th:if="${#lists.isEmpty(assignedTags)}">No tags assigned yet.</p><div class="ps-assigned-tags"><div class="ps-assigned-tag" th:each="tag : ${assignedTags}"><span th:text="${tag.name()}"></span><form th:if="${tool.status.name() == 'DRAFT'}" th:action="@{/dashboard/tools/{id}/tags/{tagId}/unassign(id=${tool.id},tagId=${tag.id()})}" method="post"><button class="ps-btn ps-btn--ghost" type="submit" th:aria-label="'Remove ' + ${tag.name()}">Remove</button></form></div></div><p th:if="${tool.status.name() != 'DRAFT'}" class="ps-muted">Tags can only be changed while this tool is a draft.</p></section><form th:if="${tool.status.name() == 'DRAFT' and !#lists.isEmpty(availableTags)}" class="ps-panel ps-e-form ps-reference-form" method="post" th:action="@{/dashboard/tools/{id}/tags/assign(id=${tool.id})}"><h2>Add a tag</h2><div><label for="tagId">Available tags</label><select id="tagId" name="tagId" required><option value="">Choose a tag</option><option th:each="tag : ${availableTags}" th:value="${tag.id()}" th:text="${tag.name()}"></option></select></div><button class="ps-btn ps-btn--primary" type="submit">Add tag</button></form><p th:if="${tool.status.name() == 'DRAFT' and #lists.isEmpty(availableTags)}" class="ps-muted">There are no additional tags available.<a th:if="${isAdmin == true}" href="/admin/tags/new"> Create a tag</a></p><div class="ps-e-actions"><a class="ps-btn ps-btn--secondary" th:href="@{/tools/{slug}(slug=${tool.slug})}">Back to tool</a><a class="ps-btn ps-btn--secondary" th:if="${viewerId == tool.ownerId}" th:href="@{/dashboard/tools/{id}/versions(id=${tool.id})}">Manage releases</a></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>

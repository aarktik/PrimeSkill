<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>เข้าสู่ระบบ · Primeskill</title><link rel="stylesheet" th:href="@{/css/role-e.css}"><script defer th:src="@{/js/role-e.js}"></script></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" tabindex="-1" class="ps-e-page ps-auth">
    <h1>เข้าสู่ระบบ</h1><p>จัดการเวอร์ชันและติดตามการเผยแพร่เครื่องมือของคุณ</p>
    <form class="ps-e-card ps-e-form" data-auth="login" th:action="@{/api/v1/auth/login}" method="post">
        <p data-form-error role="alert" tabindex="-1" hidden></p>
        <div><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="username" maxlength="255" required></div>
        <div><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="ps-e-button ps-e-button--primary" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p>ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a></p>
    <noscript>หน้านี้ต้องเปิด JavaScript เพื่อเชื่อมกับระบบเข้าสู่ระบบ</noscript>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
